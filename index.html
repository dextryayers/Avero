<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVERO STUDIO - Open Source Photo Editor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; }
      #boot-fallback {
        display: none;
        height: 100vh;
        place-items: center;
        color: #e0e0e0;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot-fallback">
      <div>
        <div style="font-weight: 700; font-size: 15px; margin-bottom: 8px;">AVERO STUDIO gagal memuat UI</div>
        <div id="boot-msg">Modul frontend tidak berjalan. Coba muat ulang aplikasi.</div>
        <button
          onclick="window.location.reload()"
          style="margin-top: 12px; background: #0a84ff; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer;"
        >
          Muat ulang
        </button>
      </div>
    </div>
    <script>
      // Pengaman anti blank screen: jika React tidak mount dalam 10 detik,
      // tampilkan pesan (ErrorBoundary hanya tangkap error render, bukan gagal load).
      setTimeout(function () {
        if (!window.__avero_mounted) {
          document.getElementById("boot-fallback").style.display = "grid";
        }
      }, 10000);
      window.addEventListener("error", function (e) {
        if (!window.__avero_mounted) {
          var m = document.getElementById("boot-msg");
          if (m && e && e.message) m.textContent = "Error: " + e.message;
          document.getElementById("boot-fallback").style.display = "grid";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
