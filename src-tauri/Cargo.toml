[package]
name = "avero-studio"
version = "2.0.0"
description = "AVERO STUDIO - Open source professional photo editor for Linux and Windows"
authors = ["AVERO STUDIO Contributors"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "avero_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# custom-protocol WAJIB: tanpa ini binary (termasuk via plain cargo build)
# fall back ke devUrl localhost dan tidak meng-embed frontend sama sekali.
# CLI tauri menambahkan feature ini otomatis, cargo polos tidak.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "tga", "ico", "pnm", "qoi", "dds", "exr", "ff", "hdr"] }
psd = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1"
sysinfo = "0.30"
bytemuck = "1"
# Plan5 Fase 0: local YOLO11 inference (things). Exact RC pin: 2.0 stable is not
# published yet and caret requirements skip prereleases. ort fetches prebuilt
# ONNX Runtime binaries on first build (network required once, then cached).
# No ndarray needed: Tensor::from_array accepts a plain (shape, Vec) tuple.
ort = { version = "=2.0.0-rc.13" }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
